name: Docs

# Reusable workflow. It checks every Markdown file with markdownlint-cli2,
# lychee and Vale.
#
# Caller contract:
# - Grant `contents: read`.
# - Expose a `docs` dev shell in the flake, for example `inputsFrom =
#   [ hub.devShells.<system>.docs ]`. The caller's `flake.lock` pins the tool
#   versions.
# - Keep the files that `sync-config` writes, because the tools read them.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          JSON for the `runs-on` key, for example "ubuntu-latest" or
          ["ubuntu-24.04-arm"].
        type: string
        default: '"ubuntu-latest"'

permissions: {}

jobs:
  docs:
    name: markdownlint, lychee and Vale
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: markdownlint-cli2
        run: nix develop .#docs -c markdownlint-cli2 "**/*.md"
      - name: lychee
        run: nix develop .#docs -c lychee --no-progress "**/*.md"
      - name: Vale
        run: nix develop .#docs -c sh -c 'vale sync && vale --no-global --minAlertLevel=error .'
