name: Secrets

# Reusable workflow. It scans every branch and tag of the repository, with its
# whole history, for secrets with the gitleaks CLI.
#
# The scanner comes from the flake of this workflow's own repository, at the
# commit of this workflow file (`job.workflow_repository` and
# `job.workflow_sha`). It never comes from the checkout. The scanner and its
# rules come from the hub and not from the tree of the pull request. A pull
# request can still change the calling workflow and the flake files. A reviewer
# checks them, and a consumer requires a code owner for `.github/workflows/`
# and `flake.*`. A caller that pins this workflow by SHA runs the scanner of
# that commit. The hub's own `ci.yml` calls this file with `./`, so the hub
# scans its pull requests with the scanner of the pull request. A pull request
# of the hub can change `ci.yml` itself, so review is the control there.
#
# The scan uses the default rules of gitleaks and never reads the
# `.gitleaks.toml` of the repository, because a pull request could add an
# allowlist that hides its own secret. A person can still suppress one finding
# with a fingerprint in `.gitleaksignore` or a `gitleaks:allow` comment, and a
# reviewer sees either in the diff. The log option `--all` scans every branch
# and tag, and `--text -m` reads a file that `.gitattributes` marks `-diff` and
# the changes of a merge commit, such as the resolution of a conflict. Git omits
# both by default. docs/how-to/adopt-the-hub.md lists what the scan does not see.
#
# Caller contract:
# - Grant `contents: read`.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          JSON for the `runs-on` key, as a string. Quote it under `with:`, for
          example '"ubuntu-latest"' or '["ubuntu-24.04-arm"]'.
        type: string
        default: '"ubuntu-latest"'

permissions: {}

jobs:
  secrets:
    name: gitleaks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Scan the history
        shell: bash
        env:
          SCANNER_REPOSITORY: ${{ job.workflow_repository }}
          SCANNER_SHA: ${{ job.workflow_sha }}
        run: |
          # An empty value makes the reference a relative path that a pull
          # request could plant.
          : "${SCANNER_REPOSITORY:?}" "${SCANNER_SHA:?}"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          nix run "github:${SCANNER_REPOSITORY}/${SCANNER_SHA}#gitleaks" -- git --config "$RUNNER_TEMP/gitleaks.toml" --log-opts="--all --text -m" --redact --verbose
