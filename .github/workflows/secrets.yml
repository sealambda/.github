name: Secrets

# Reusable workflow. It scans the whole git history for secrets with the
# gitleaks CLI.
#
# Caller contract:
# - Grant `contents: read`.
# - Expose gitleaks in the default dev shell of the flake, for example
#   `inputsFrom = [ hub.devShells.<system>.base ]`. The caller's `flake.lock`
#   pins the tool version.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          JSON for the `runs-on` key, for example "ubuntu-latest" or
          ["ubuntu-24.04-arm"].
        type: string
        default: '"ubuntu-latest"'

permissions: {}

jobs:
  secrets:
    name: gitleaks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Scan the history
        run: nix develop -c gitleaks git --redact --verbose
