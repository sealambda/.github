name: Secrets

# Scan the Git history of the checked-out commit of the calling repository for committed credentials
# with gitleaks, the organization's secret scanner. A finding fails the job; its log shows the rule,
# the file, the line and the commit, with the secret redacted. gitleaks reads its configuration from
# the scanned tree. Inputs, configuration and exceptions: docs/reference/workflows.md#secrets.
#
# The rule of the `runs-on` expression is in
# docs/reference/workflows.md#rules-for-every-workflow.
on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          The runner of the job, as JSON: one label in quotes, or an array of labels. A public
          repository always runs on GitHub-hosted runners, whatever this input says.
        type: string
        default: '"ubuntu-24.04"'

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ github.event.repository.private && fromJSON(inputs.runs-on) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    # The official image, pinned by digest.
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      # All of history, because a secret stays exposed in an old commit after a later one removes it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Pull the image
        uses: $/.github/actions/docker-pull
        with:
          image: ${{ env.GITLEAKS_IMAGE }}
      # The container reads the checkout and has no network, so the scan can neither change the
      # checkout nor send what it finds. Without --verbose gitleaks only counts the findings; with
      # it the log shows each one, secret redacted. --log-opts=HEAD limits the scan to the commits
      # reachable from the checked-out commit. By default gitleaks scans every ref that the full
      # fetch brought in, so a stale branch of the repository would fail the scan of every other
      # branch.
      - name: Scan the history
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "${PWD}:/repo:ro" --workdir /repo \
            "${GITLEAKS_IMAGE}" git --no-banner --redact --verbose --log-opts=HEAD --exit-code 1 .
