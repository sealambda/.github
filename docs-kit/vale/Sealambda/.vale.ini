# The Sealambda prose style for Vale: Google's developer documentation style
# guide as the base, a few Microsoft rules where Google has none, and the
# house rules of the Sealambda style in styles/Sealambda/.
#
# Vale reads this file as the package configuration of the Sealambda package
# (docs-kit/README.md, "Vale package"). The repository's own .vale.ini is
# read after it and wins where both set one value. The Nix check of the docs
# kit builds its configuration from this file as well and sets StylesPath to
# the styles in the Nix store.
#
# The source of this file in the repository has no Packages line on purpose.
# kit.nix adds the line at the top of the copy in the release asset
# Sealambda.zip, with the versions of Google and Microsoft that the locked
# nixpkgs holds, so that the asset and the Nix check lint with the same rules
# and no second pin exists.
#
# Levels. A rule at level error fails the check. A rule at level suggestion
# shows in an editor and never fails a check: it is a judgment call, or it
# flags words that technical documents need. No rule has level warning.
Vocab = Sealambda
MinAlertLevel = suggestion

# Front matter is data, not prose. Vale lints each string value of the block
# as text of the scope text.frontmatter.<key>, so the scope is ignored. The
# other scopes are the defaults of this key, which a value here replaces.
IgnoredScopes = code, tt, kbd, samp, frontmatter

[*.md]
BasedOnStyles = Vale, Google, Sealambda

# The built-in rule Vale.Spelling checks words against a dictionary that does
# not know technical terms. The typos check of the toolchain finds misspellings
# instead. Vale.Terms (the case of the words in accept.txt) and Vale.Avoid (the
# words in reject.txt) stay on.
Vale.Spelling = NO

# Google rules that are errors in the style guide and stay errors. Each one
# is a fact that a writer fixes without judgment.
Google.AMPM = error
Google.DateFormat = error
Google.Exclamation = error
Google.Gender = error
Google.GenderBias = error
Google.Latin = error
Google.LyHyphens = error
Google.OptionalPlurals = error
Google.Ordinal = error
Google.Periods = error
Google.Slang = error
Google.Spacing = error
Google.Units = error

# Google.EmDash demands no spaces around an em dash, and Microsoft.Dashes
# demands the same. One writer fixes it in seconds, so it is an error.
Google.EmDash = error

# Google rules that are judgment calls, or that flag words these documents
# need. They show in an editor only.
Google.Colons = suggestion
Google.Ellipses = suggestion
Google.FirstPerson = suggestion
Google.HeadingPunctuation = suggestion
Google.OxfordComma = suggestion
Google.Passive = suggestion
Google.Ranges = suggestion
Google.Semicolons = suggestion
Google.Spelling = suggestion
Google.Timeless = NO
Google.We = suggestion
Google.Will = suggestion
Google.WordList = suggestion
Google.WordListCase = suggestion
# Quotes demands a comma or a period inside the quotation marks. A document
# that quotes a command or a title exactly must keep the mark outside.
Google.Quotes = suggestion
# Not used. Acronyms reports every acronym that the file does not define, and
# Google's exception list does not know the terms of these documents.
# Contractions asks for "don't"; Simplified Technical English (the writing
# style of CONTRIBUTING.md) writes "do not". Parens flags every parenthesis,
# which a defined acronym or a unit needs. Jargon and Anthropomorphism flag
# "break-glass" and "the tool sees", which are normal in technical documents.
Google.Acronyms = NO
Google.Anthropomorphism = NO
Google.Contractions = NO
Google.ExcessiveClaims = NO
Google.Jargon = NO
Google.Parens = NO

# Replaced by a rule of the Sealambda style that extends it and adds the
# terms of these documents (styles/Sealambda/).
Google.Headings = NO

# Microsoft rules with no Google counterpart. Rules of both guides that do
# the same thing, such as Passive, run once, from Google.
Microsoft.Wordiness = suggestion
