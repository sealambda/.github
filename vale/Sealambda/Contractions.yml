# A page writes full forms: "does not", not the contraction of the two words
# (docs/reference/writing-style.md#full-forms). A contraction is harder to
# read for a person who learns English as a second language, and a machine
# translation can miss it.
#
# The rule has three tokens:
#
# - a word that ends in an apostrophe and "t", such as the contraction of
#   "is not";
# - the words "it", "that", "what", "there", "here", "who", "let", "he", "she",
#   "where", "how" and "when" with an apostrophe and "s", such as the
#   contraction of "it is";
# - a word with an apostrophe and "re", "ve", "ll", "d" or "m", such as the
#   contraction of "they are".
#
# The match is whole-word in any letter case, and it takes the straight and the
# curly apostrophe. A possessive such as "the hub's base" does not match,
# because the second token lists the words that take "'s" as a contraction.
# Vale skips code spans and code blocks in Markdown files and in the comments of
# the languages that config/vale.ini maps to Markdown. A quoted message of a
# tool then stays as written when it is in code. The comments of the other
# languages have no code spans for Vale, so it checks text in backticks too.
# The rule replaces Google.Contractions, which asks for the opposite and which
# config/vale.ini turns off. Every token is a fixed pattern of letters, so the
# matcher cannot backtrack without limit.
# Level: error.
extends: existence
message: "Write the full form instead of the contraction '%s'."
link: https://github.com/sealambda/.github/blob/main/docs/reference/writing-style.md#full-forms
level: error
ignorecase: true
tokens:
  - "[a-z]+n['’]t"
  - "(?:it|that|what|there|here|who|let|he|she|where|how|when)['’]s"
  - "[a-z]+['’](?:re|ve|ll|d|m)"
