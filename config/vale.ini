# Prose lint settings of every Sealambda repository.
# https://docs.vale.sh/topics/.vale.ini
# The styles in BasedOnStyles come from Nix, and `flake.lock` pins their
# versions. The hub's `vale.withStyles` package sets VALE_STYLES_PATH, and Vale
# finds the styles there. Do not run `vale sync`, and do not run Vale with
# `--no-global`: that flag makes Vale ignore VALE_STYLES_PATH, so it reports
# "Style 'Google' isn't on the StylesPath". `valeWithStyles` in the hub's `flake.nix` must
# provide each style that BasedOnStyles names, except the built-in `Vale`.
# Google comes from nixpkgs. Sealambda is the hub's own style
# (`vale/Sealambda` in the hub): its rules keep a page in the present tense and
# in full forms. The rules Sealambda.CurrentState, Sealambda.Contractions,
# Sealambda.SentenceLength, Sealambda.CommentSentenceLength and
# Sealambda.Filler have the level error, and Sealambda.History has the level
# suggestion, which the docs check does not report. The sections below also set
# Google.Will to the level error.
# StylesPath holds only the vocabularies in StylesPath/config/vocabularies.
# The hub syncs the vocabulary Sealambda, the terms of the organization. Each
# repository keeps its own terms in Repository/accept.txt and must create that
# file, even if empty: Vale stops with an error when a listed vocabulary is
# missing.
StylesPath = .vale/styles
Vocab = Sealambda, Repository

# Vale parses the comments of these code languages as Markdown, so the `sentence`
# scope exists in them and Vale skips code spans, fenced code and indented code
# in a comment. Without this mapping a comment has no `sentence` scope, and Vale
# lints a docstring as plain text.
[formats]
py = md
ex = md
exs = md
ts = md
tsx = md
js = md
mjs = md
cjs = md
jsx = md
mts = md
cts = md
css = md
scss = md
# Vale has no parser for shell, YAML, TOML, Dockerfile, SQL, Nix and HCL. Each of
# these maps to a language whose comments Vale finds by pattern: `r` for `#`
# comments, `hs` for SQL and `ps1` for Nix and HCL. The behavior was measured on
# Vale 3.25.1. Measure it again when the Vale version changes. These comments
# have the scope `text.comment` and no `sentence` scope, so the rule
# CommentSentenceLength replaces SentenceLength for them. A mapping does not
# chain, and the file name `Dockerfile` has no extension to match.
sh = r
bash = r
bats = r
zsh = r
dockerfile = r
yml = r
yaml = r
toml = r
Dockerfile = r
sql = hs
nix = ps1
tf = ps1
tofu = ps1
tfvars = ps1
hcl = ps1

[*.md]
BasedOnStyles = Vale, Google, Sealambda
# Google.Contractions asks for contractions. The hub's pages use full forms.
Google.Contractions = NO
# A page states what is true now, so "will" is an error.
Google.Will = error
# SentenceLength checks a page. CommentSentenceLength is for other languages.
Sealambda.CommentSentenceLength = NO

# Vale checks the comments and the doc comments of these code languages, and
# nothing else in the file. Domain words such as "Phase 2" are real code terms,
# so CurrentState is off. Google.Will stays on, because a comment states what is
# true now. BlockIgnores skips a doctest: the `iex>` or `>>>` line and the lines
# of its result, up to the next blank line.
[*.{py,ex,exs,ts,tsx,js,mjs,cjs,jsx,mts,cts,css,scss}]
BasedOnStyles = Sealambda
Sealambda.CurrentState = NO
Sealambda.CommentSentenceLength = NO
Google.Will = error
BlockIgnores = (?m)^ *(?:>>>|iex>)[^\n]*\n(?:[^\n]+\n)*

# Vale checks the comments of these languages and nothing else in the file. The
# comments have no `sentence` scope, so CommentSentenceLength checks the length.
[*.{sh,bash,bats,zsh,yml,yaml,toml,sql,dockerfile}]
BasedOnStyles = Sealambda
Sealambda.CurrentState = NO
Google.Will = error

# The file name Dockerfile has no extension, so the section above cannot match it.
[{Dockerfile,**/Dockerfile}]
BasedOnStyles = Sealambda
Sealambda.CurrentState = NO
Google.Will = error

# Vale reads these files one line at a time, so it cannot join the lines of a
# comment into a sentence, and CommentSentenceLength is off. A `#` inside a
# string starts a comment for Vale, so Vale checks the rest of that line.
[*.{nix,tf,tofu,tfvars,hcl}]
BasedOnStyles = Sealambda
Sealambda.CurrentState = NO
Sealambda.CommentSentenceLength = NO
Google.Will = error

# MADR 4.0.0 fixes the section titles of a decision record, such as "Decision
# Drivers", and they are not in sentence case, which Google.Headings asks for.
[{docs,**/docs}/decisions/**/*.md]
Google.Headings = NO

# A decision record states what a decision will change, and a spec describes
# work that is not built yet, so the words of a plan belong to both. A pattern
# lists "docs" and "**/docs", because Vale matches a section against the path
# as the caller wrote it, and an editor passes an absolute path.
[{docs,**/docs}/{decisions,specs}/**/*.md]
Sealambda.CurrentState = NO
Google.Will = NO
